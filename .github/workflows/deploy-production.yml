name: Deploy production

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy tagged release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag and commit
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must use strict vMAJOR.MINOR.PATCH format." >&2
            exit 1
          fi

          release_commit="$(git rev-list -n 1 "$GITHUB_REF")"
          git fetch --no-tags origin main

          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "The tagged commit must belong to main." >&2
            exit 1
          fi

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run type checking
        run: npm exec -- tsc --noEmit

      - name: Materialize extension signing key
        shell: bash
        env:
          CHROME_EXTENSION_SIGNING_KEY: ${{ secrets.CHROME_EXTENSION_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$CHROME_EXTENSION_SIGNING_KEY"
          key_path="$RUNNER_TEMP/recall-extension-upload.pem"
          umask 077
          printf '%s\n' "$CHROME_EXTENSION_SIGNING_KEY" > "$key_path"
          echo "RECALL_EXTENSION_SIGNING_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Package production extension
        run: npm run extension:package:prod -- --version "${GITHUB_REF_NAME#v}" --crx

      - name: Remove extension signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/recall-extension-upload.pem"

      - name: Upload extension packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recall-chrome-${{ github.ref_name }}
          path: artifacts/chrome/recall-chrome-*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Install pinned Vercel CLI
        run: npm install --global --ignore-scripts vercel@59.10.0

      - name: Pull Vercel production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production deployment
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production build
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Record deployment URL
        run: 'echo "Production deployment: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"'

  # Runs after the web deploy so production already serves the matching API.
  # The Store token and the CRX signing key never share a job.
  publish-extension:
    name: Publish extension to Chrome Web Store
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: chrome-web-store
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: chrome-web-store
      cancel-in-progress: false
    env:
      CWS_ITEM_ID: mifdhnokgeipckgedpbnccdlllpdpcel
      CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
      CWS_WIF_PROVIDER: ${{ vars.CWS_WIF_PROVIDER }}
      CWS_SERVICE_ACCOUNT: ${{ vars.CWS_SERVICE_ACCOUNT }}

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate Store configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CWS_PUBLISHER_ID" || { echo "Set CWS_PUBLISHER_ID in the chrome-web-store environment." >&2; exit 1; }
          test -n "$CWS_WIF_PROVIDER" || { echo "Set CWS_WIF_PROVIDER in the chrome-web-store environment." >&2; exit 1; }
          test -n "$CWS_SERVICE_ACCOUNT" || { echo "Set CWS_SERVICE_ACCOUNT in the chrome-web-store environment." >&2; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Download extension packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: recall-chrome-${{ github.ref_name }}
          path: artifacts/chrome

      - name: Verify extension package checksums
        working-directory: artifacts/chrome
        run: sha256sum -c "recall-chrome-${GITHUB_REF_NAME}.sha256"

      - name: Get Chrome Web Store access token
        id: store-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.CWS_WIF_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 1800s
          create_credentials_file: false
          export_environment_variables: false

      - name: Upload and publish extension
        env:
          CWS_ACCESS_TOKEN: ${{ steps.store-auth.outputs.access_token }}
        run: >-
          node scripts/publish-extension.mjs
          --version "${GITHUB_REF_NAME#v}"
          --crx "artifacts/chrome/recall-chrome-${GITHUB_REF_NAME}.crx"
          --zip "artifacts/chrome/recall-chrome-${GITHUB_REF_NAME}.zip"
